name: Что-то сломалось
description: Ошибка в скрипте
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: Версия
      description: Видна в менеджере скриптов.
      placeholder: 2.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер и менеджер скриптов
      placeholder: Chrome 141 и Tampermonkey 5.3
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Страница
      description: Адрес тайтла или раздела AniList. Если везде — так и напишите.
      placeholder: https://anilist.co/anime/207141/
  - type: textarea
    id: steps
    attributes:
      label: Что делали, чего ждали, что получилось
      description: Пошагово. Снимок экрана можно перетащить сюда.
      placeholder: |
        1. Открыл страницу тайтла.
        2. Нажал «Смотреть».
        Ждал плеер, получил пустое окно.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Записи логгера
      description: Настройки → Разработчик → Отладка, повторите действие и скопируйте строки с ошибками.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Стоит последний выпуск
          required: true
        - label: Поиск по существующим issue ничего похожего не дал
          required: true
        - label: Проверено с отключёнными другими расширениями
